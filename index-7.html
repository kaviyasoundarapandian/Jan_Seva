        :root{--bg:#F4F7FC;--card:#fff;--ink:#0F1B3D;--mut:#4F5D7D;--pri:#0A3C91;--pri2:#011D53;--sos:#C62828;--amb:#F28C1B;--line:#D5E0F2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

        :root[data-theme="dark"]{--bg:#0A1226;--card:#111C38;--ink:#E8EEFB;--mut:#A9B7D6;--pri:#4A8FE7;--pri2:#011D53;--line:#24335C}
        *{box-sizing:border-box}

        header small{display:block;font-weight:400;opacity:.9;font-size:13px}
        #lang{max-width:150px;background:#fff;color:#011D53;border:0;border-radius:20px;padding:6px 14px;font:600 15px 'Mukta',sans-serif}
        main{max-width:640px;margin:0 auto;padding:14px 14px 20px}

        .tile{background:var(--card);border:1px solid var(--line);border-bottom:3px solid var(--amb);border-radius:10px;padding:16px 12px;text-align:left;color:var(--ink);font:600 17px 'Mukta',sans-serif;cursor:pointer}

        label{display:block;font-weight:600;margin:10px 0 4px}
        input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:400 16px 'Mukta',sans-serif}
        button.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:600 16px 'Mukta',sans-serif;cursor:pointer;margin:8px 8px 0 0}
        button.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
        button.big{width:100%;background:var(--sos);color:#fff;border:0;border-radius:14px;padding:26px 10px;font:800 26px 'Mukta',sans-serif;cursor:pointer}

        nav button.on{color:var(--pri);border-top:3px solid var(--amb);padding-top:7px;font-weight:800}
        h3.sec{font-family:'Playfair Display','Mukta',serif;font-size:17px;margin:16px 0 6px;color:var(--pri)}

        .pill.ok{background:#0A3C91;color:#fff}
        .muted{color:var(--mut);font-size:14px}
        img.ph{max-width:100%;border-radius:8px;margin-top:8px}

        #gt_el{position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden}
        font{vertical-align:baseline}

        /* ---------- global search (tabs + features) ---------- */
        #gs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 14px;border-bottom:1px solid var(--line)}

        #gs .gsw{max-width:640px;margin:0 auto;position:relative}

        #gs input{flex:1;min-width:0;width:auto;border:0;background:transparent;padding:11px 0;font:400 16px 'Mukta',sans-serif;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
        #gs input:focus-visible{outline:none}
        #gs input::-webkit-search-cancel-button{display:none}
        #gs #gsx{display:none;background:none;border:0;color:var(--mut);font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer}
        #gsr{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);max-height:min(62vh,480px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(1,29,83,.28);overscroll-behavior:contain}
        #gsr .gsh{margin:0;padding:8px 14px 4px;font:700 12px 'Mukta',sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);position:sticky;top:0;background:var(--card)}
        #gsr .gsrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;color:var(--ink);font:600 16px 'Mukta',sans-serif;cursor:pointer}
        #gsr .gsrow:last-child{border-bottom:0}
        #gsr .gsrow:hover,#gsr .gsrow.on{background:var(--bg)}
        #gsr .gsrow.on{box-shadow:inset 3px 0 0 var(--amb)}
        #gsr .gse{font-size:22px;flex:none;width:28px;text-align:center}
        #gsr .gst{display:block;min-width:0;overflow-wrap:anywhere}
        #gsr .gst small{display:block;font:400 13px 'Mukta',sans-serif;color:var(--mut)}
        #gsr mark{background:rgba(242,140,27,.35);color:inherit;border-radius:3px;padding:0 1px}
        #gsr .gsn{padding:16px 14px;color:var(--mut)}
        .gs-hit{outline:3px solid var(--amb)!important;outline-offset:3px;border-radius:8px;transition:outline-color .3s}

    {id:'flood',k:['flood','baad','\u092c\u093e\u095d','rain','water'],en:['Move to higher ground at once.','Switch off electricity and gas. Do not touch wires.','Never walk or drive through moving water.','Keep drinking water, torch, phone power bank and documents ready.'],hi:['\u0924\u0941\u0930\u0902\u0924 \u090a\u0902\u091a\u0947 \u0938\u094d\u0925\u093e\u0928 \u092a\u0930 \u091c\u093e\u090f\u0902\u0964','\u092c\u093f\u091c\u0932\u0940 \u0914\u0930 \u0917\u0948\u0938 \u092c\u0902\u0926 \u0915\u0930\u0947\u0902\u0964 \u0924\u093e\u0930\u094b\u0902 \u0915\u094b \u0928 \u091b\u0942\u090f\u0902\u0964','\u092c\u0939\u0924\u0947 \u092a\u093e\u0928\u0940 \u092e\u0947\u0902 \u092a\u0948\u0926\u0932 \u092f\u093e \u0917\u093e\u095c\u0940 \u0938\u0947 \u0928 \u091c\u093e\u090f\u0902\u0964','\u092a\u0940\u0928\u0947 \u0915\u093e \u092a\u093e\u0928\u0940, \u091f\u0949\u0930\u094d\u091a, \u092a\u093e\u0935\u0930 \u092c\u0948\u0902\u0915 \u0914\u0930 \u0915\u093e\u0917\u095b\u093e\u0924 \u0924\u0948\u092f\u093e\u0930 \u0930\u0916\u0947\u0902\u0964']},
    {id:'quake',k:['earthquake','quake','bhukamp','\u092d\u0942\u0915\u0902\u092a'],en:['Drop, cover and hold under a strong table. Stay away from windows.','If outside, move to an open area away from buildings and poles.','After shaking stops, leave the building by stairs, not the lift.','Expect aftershocks. Check for gas leaks before using flames.'],hi:['\u091d\u0941\u0915\u0947\u0902, \u092e\u095b\u092c\u0942\u0924 \u092e\u0947\u095b \u0915\u0947 \u0928\u0940\u091a\u0947 \u091b\u093f\u092a\u0947\u0902 \u0914\u0930 \u0938\u0939\u093e\u0930\u093e \u0932\u0947\u0902\u0964 \u0916\u093f\u095c\u0915\u093f\u092f\u094b\u0902 \u0938\u0947 \u0926\u0942\u0930 \u0930\u0939\u0947\u0902\u0964','\u092c\u093e\u0939\u0930 \u0939\u094b\u0902 \u0924\u094b \u0916\u0941\u0932\u0940 \u091c\u0917\u0939 \u092a\u0930 \u091c\u093e\u090f\u0902, \u0907\u092e\u093e\u0930\u0924 \u0914\u0930 \u0916\u0902\u092d\u094b\u0902 \u0938\u0947 \u0926\u0942\u0930\u0964','\u091d\u091f\u0915\u0947 \u0930\u0941\u0915\u0928\u0947 \u092a\u0930 \u0938\u0940\u095d\u093f\u092f\u094b\u0902 \u0938\u0947 \u0928\u093f\u0915\u0932\u0947\u0902, \u0932\u093f\u092b\u094d\u091f \u0938\u0947 \u0928\u0939\u0940\u0902\u0964','\u092a\u0940\u091b\u0947 \u0915\u0947 \u091d\u091f\u0915\u0947 \u0906 \u0938\u0915\u0924\u0947 \u0939\u0948\u0902\u0964 \u0906\u0917 \u091c\u0932\u093e\u0928\u0947 \u0938\u0947 \u092a\u0939\u0932\u0947 \u0917\u0948\u0938 \u0932\u0940\u0915 \u091c\u093e\u0901\u091a\u0947\u0902\u0964']},
    {id:'fire',k:['fire','aag','\u0906\u0917','smoke'],en:['Alert everyone and call 101 or 112.','Stay low under smoke. Cover nose and mouth with a wet cloth.','Do not use lifts. Use the stairs.','If clothes catch fire: stop, drop and roll.'],hi:['\u0938\u092c\u0915\u094b \u0938\u091a\u0947\u0924 \u0915\u0930\u0947\u0902 \u0914\u0930 101 \u092f\u093e 112 \u092a\u0930 \u0915\u0949\u0932 \u0915\u0930\u0947\u0902\u0964','\u0927\u0941\u090f\u0902 \u092e\u0947\u0902 \u0928\u0940\u091a\u0947 \u091d\u0941\u0915\u0915\u0930 \u091a\u0932\u0947\u0902\u0964 \u0928\u093e\u0915-\u092e\u0941\u0902\u0939 \u0917\u0940\u0932\u0947 \u0915\u092a\u095c\u0947 \u0938\u0947 \u0922\u0915\u0947\u0902\u0964','\u0932\u093f\u092b\u094d\u091f \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0928 \u0915\u0930\u0947\u0902, \u0938\u0940\u095d\u093f\u092f\u093e\u0901 \u0932\u0947\u0902\u0964','\u0915\u092a\u095c\u094b\u0902 \u092e\u0947\u0902 \u0906\u0917 \u0932\u0917\u0947 \u0924\u094b \u0930\u0941\u0915\u0947\u0902, \u0932\u0947\u091f\u0947\u0902 \u0914\u0930 \u0932\u0941\u095c\u0915\u0947\u0902\u0964']},
    {id:'heat',k:['heat','heatwave','lu','\u0932\u0942','garmi'],en:['Stay indoors between 12 pm and 4 pm.','Drink water often, even if not thirsty. Use ORS or buttermilk.','Wear light, loose, cotton clothes and cover your head.','Fever, dizziness or confusion: move to shade, cool the body and call 108.'],hi:['\u0926\u094b\u092a\u0939\u0930 12 \u0938\u0947 4 \u092c\u091c\u0947 \u0924\u0915 \u0918\u0930 \u092e\u0947\u0902 \u0930\u0939\u0947\u0902\u0964','\u092a\u094d\u092f\u093e\u0938 \u0928 \u0939\u094b \u092b\u093f\u0930 \u092d\u0940 \u092a\u093e\u0928\u0940, ORS \u092f\u093e \u091b\u093e\u091b \u092a\u093f\u090f\u0902\u0964','\u0939\u0932\u094d\u0915\u0947, \u0922\u0940\u0932\u0947 \u0938\u0942\u0924\u0940 \u0915\u092a\u095c\u0947 \u092a\u0939\u0928\u0947\u0902 \u0914\u0930 \u0938\u093f\u0930 \u0922\u0915\u0947\u0902\u0964','\u092c\u0941\u0916\u093e\u0930, \u091a\u0915\u094d\u0915\u0930 \u092f\u093e \u092d\u094d\u0930\u092e \u092e\u0947\u0902 \u091b\u093e\u0901\u0935 \u092e\u0947\u0902 \u091c\u093e\u090f\u0902, \u0936\u0930\u0940\u0930 \u0920\u0902\u0921\u093e \u0915\u0930\u0947\u0902 \u0914\u0930 108 \u092a\u0930 \u0915\u0949\u0932 \u0915\u0930\u0947\u0902\u0964']},
    {id:'prep',k:['prepare','preparation','kit','before','tayari','तैयारी'],en:['Keep an emergency kit: drinking water, dry food, torch, power bank, first-aid box, medicines, radio and copies of documents.','Make a family plan: where to meet and who to call. Save 112, 1078 and your district control room 1077 in your phone.','Know your nearest shelter, high ground and safe route. Keep the phone charged and the fuel tank at least half full.','Follow IMD and district authority warnings. Move early when told. Do not wait.'],hi:['आपातकालीन किट रखें: पीने का पानी, सूखा खाना, टॉर्च, पावर बैंक, फर्स्ट-एड बॉक्स, दवाइयाँ, रेडियो और ज़रूरी कागज़ों की कॉपी।','परिवार की योजना बनाएँ: कहाँ मिलना है और किसे फोन करना है। फोन में 112, 1078 और अपने ज़िला नियंत्रण कक्ष 1077 का नंबर सेव करें।','नज़दीकी आश्रय स्थल, ऊँची जगह और सुरक्षित रास्ता जानें। फोन चार्ज और वाहन की टंकी कम से कम आधी भरी रखें।','IMD और ज़िला प्रशासन की चेतावनी मानें। कहे जाने पर जल्दी निकलें, इंतज़ार न करें।']},
    {id:'cyclone',k:['cyclone','storm','toofan','tufan','चक्रवात','तूफ़ान'],en:['When a warning is issued, stay indoors and away from windows. Do not go to the sea or the beach.','Secure loose objects, roof sheets and boats. Keep a radio and torch ready.','Store drinking water and dry food for several days. Charge phones and power banks.','If told to evacuate, go to the nearest cyclone shelter at once. Switch off power and gas before leaving.'],hi:['चेतावनी जारी होने पर घर के अंदर रहें और खिड़कियों से दूर रहें। समुद्र या समुद्र तट पर न जाएँ।','ढीली चीज़ें, छत की चादरें और नावें बाँधकर रखें। रेडियो और टॉर्च तैयार रखें।','कई दिनों के लिए पीने का पानी और सूखा खाना रखें। फोन और पावर बैंक चार्ज कर लें।','निकलने को कहा जाए तो तुरंत नज़दीकी चक्रवात आश्रय स्थल पर जाएँ। निकलने से पहले बिजली और गैस बंद करें।']},
    {id:'lightning',k:['lightning','thunder','bijli','बिजली'],en:['At the first thunder, go inside a strong building or a vehicle with the windows closed.','Stay away from trees, poles, open fields, water and metal objects.','If caught outside, crouch low on the balls of your feet with your head down. Do not lie flat.','Do not use wired phones or plug-in appliances in a storm. Wait 30 minutes after the last thunder.'],hi:['पहली गड़गड़ाहट पर पक्की इमारत या बंद शीशों वाली गाड़ी के अंदर चले जाएँ।','पेड़ों, खंभों, खुले मैदान, पानी और धातु की चीज़ों से दूर रहें।','बाहर फँस जाएँ तो पंजों के बल नीचे झुककर बैठें और सिर झुका लें। ज़मीन पर लेटें नहीं।','तूफ़ान में तार वाले फोन या प्लग वाले उपकरण इस्तेमाल न करें। आखिरी गड़गड़ाहट के 30 मिनट बाद ही बाहर निकलें।']},
    {id:'landslide',k:['landslide','mudslide','bhuskhalan','भूस्खलन'],en:['Cracks in the ground, tilting trees or poles and muddy water in streams are warning signs. Leave at once.','Move away from the slope to higher ground at the side. Do not run down the path of the slide.','Do not cross bridges or roads during heavy rain in hill areas.','After a slide, stay away from the area. More slides can follow. Call 112.'],hi:['ज़मीन में दरारें, झुकते पेड़ या खंभे और नालों में गंदा पानी चेतावनी के संकेत हैं। तुरंत जगह छोड़ दें।','ढलान से दूर, किनारे की ऊँची जगह पर जाएँ। भूस्खलन के रास्ते में नीचे की ओर न भागें।','पहाड़ी इलाकों में भारी बारिश के दौरान पुल या सड़क पार न करें।','भूस्खलन के बाद उस जगह से दूर रहें, और भूस्खलन हो सकते हैं। 112 पर कॉल करें।']},
    {id:'tsunami',k:['tsunami','सुनामी'],en:['If the ground shakes strongly near the coast or the sea suddenly pulls back, run to high ground at once. Do not wait for a siren.','Move at least 2 km inland or to the upper floors of a strong building.','Stay away from the beach and harbours. Waves can come many times over several hours.','Return only when the district authority says it is safe.'],hi:['तट के पास ज़मीन तेज़ हिले या समुद्र अचानक पीछे हट जाए तो तुरंत ऊँची जगह पर भागें। सायरन का इंतज़ार न करें।','कम से कम 2 किमी अंदर की ओर या किसी मज़बूत इमारत की ऊपरी मंज़िल पर जाएँ।','समुद्र तट और बंदरगाह से दूर रहें। लहरें कई घंटों में कई बार आ सकती हैं।','ज़िला प्रशासन के सुरक्षित बताने पर ही लौटें।']}

      if(d.ao!==undefined){e.stopImmediatePropagation();var p=d.ao.split('-'),r=reports[+p[0]],x=sites(r)[+p[1]];copy(body(r)).then(function(ok){if(ok)toast('Report copied. Paste it on the website.');if(window.nsPend)nsPend(+p[0],'website: '+x[0]);open2(x[1])});return}

       sv2('authSite',{n:n||'My authority',u:u,e:m});toast('Saved');panel(+d.asv);return}
      if(d.am!==undefined){e.stopImmediatePropagation();var r2=reports[+d.am],my=ld2('authSite',{});if(window.nsPend)nsPend(+d.am,'email');open2('mailto:'+encodeURIComponent(my.e)+'?subject='+encodeURIComponent('Complaint: '+t('c'+r2.cat)+' ('+r2.id+')')+'&body='+encodeURIComponent(body(r2)));return}

<script>
    /* ===== Add-on: notification centre (schemes, exams, jobs, news, disaster, blood, other) ===== */
    (function(){
     var TY=[['disaster','\u26a0\ufe0f Disaster alerts'],['blood','\ud83e\ude78 Blood donation needed'],['schemes','\ud83d\udcdc New schemes'],['exams','\ud83c\udf93 Exams and results'],['jobs','\ud83d\udcbc Jobs'],['news','\ud83d\udcf0 Important news'],['other','\ud83d\udd14 Other important']];
     function ld3(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
     function sv3(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
     function E(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
     var prefs=ld3('nfPrefs',{disaster:1,blood:1,schemes:1,exams:1,jobs:1,news:1,other:1}),
         cfg=ld3('nfCfg',{feed:'',state:''}), seen=ld3('nfSeen',[]), inbox=ld3('nfInbox',[]), last=ld3('nfLast',0), msg='';
     function bridge(){try{if(window.NsBridge&&NsBridge.setConfig)NsBridge.setConfig(cfg.feed||'',JSON.stringify(prefs),cfg.state||'')}catch(e){}}
     function ask(){try{if(window.NsBridge&&NsBridge.askPermission)NsBridge.askPermission();else if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
     function show(it){
      var ti=(it.type==='disaster'?'\u26a0\ufe0f ':it.type==='blood'?'\ud83e\ude78 ':'')+it.title;
      try{if(window.Notification&&Notification.permission==='granted')new Notification(ti,{body:it.body||''})}catch(e){}
      try{toast(ti)}catch(e){}}
     function check(manual){
      if(!cfg.feed){msg='Add a feed address below first.';if(manual)repaint();return}
      fetch(cfg.feed,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
       var n=0;(j.items||[]).forEach(function(it){
        if(!it||!it.id||seen.indexOf(it.id)>=0)return;
        seen.push(it.id);
        var ty=TY.some(function(x){return x[0]===it.type})?it.type:'other';it.type=ty;
        if(!prefs[ty])return;
        if(it.state&&cfg.state&&String(it.state).toLowerCase()!=='all'&&String(it.state).toLowerCase()!==cfg.state.toLowerCase())return;
        inbox.unshift({id:it.id,type:ty,title:String(it.title||''),body:String(it.body||''),url:it.url||'',at:it.at||new Date().toISOString()});n++;show(it)});
       seen=seen.slice(-300);inbox=inbox.slice(0,60);sv3('nfSeen',seen);sv3('nfInbox',inbox);last=Date.now();sv3('nfLast',last);
       msg=manual?(n?n+' new':'No new notices'):'';repaint()}).catch(function(){msg=manual?'Could not load the feed. Check the address and your internet.':'';if(manual)repaint()})}
     function repaint(){if(typeof tab!=='undefined'&&tab==='alerts'&&typeof render==='function')render()}
     function panel(){
      var h='<div class="card"><h2>\ud83d\udd14 Notifications</h2>';
      if(!inbox.length)h+='<p class="muted">No notices yet.</p>';
      inbox.slice(0,15).forEach(function(n){
       var ic=(TY.filter(function(x){return x[0]===n.type})[0]||['', '\ud83d\udd14'])[1].split(' ')[0];
       h+='<div class="card" style="'+(n.type==='disaster'?'border-left:6px solid var(--sos)':n.type==='blood'?'border-left:6px solid #C62828':'')+'"><b>'+ic+' '+E(n.title)+'</b><p>'+E(n.body)+'</p><span class="muted">'+E(new Date(n.at).toLocaleString())+'</span>'+(n.url&&/^(https:|tel:)/.test(n.url)?' <a class="call" href="'+E(n.url)+'" target="_blank" rel="noopener">Open</a>':'')+'</div>'});
      h+='<h3 class="sec">Choose what you get</h3><div class="chips">';
      TY.forEach(function(x){h+='<button class="chip'+(prefs[x[0]]?' on':'')+'" data-nfp="'+x[0]+'">'+x[1]+'</button>'});
      h+='</div><label for="nfs">My state (optional, shows your state and All-India notices)</label><input id="nfs" value="'+E(cfg.state)+'" placeholder="e.g. Tamil Nadu">'+
      '<label for="nff">Notice feed address (https)</label><input id="nff" type="url" value="'+E(cfg.feed)+'" placeholder="https://">'+
      '<button class="btn" data-nfsave="1">Save</button><button class="btn alt" data-nfchk="1">Check now</button><button class="btn alt" data-nfperm="1">Allow notifications</button>'+
      '<p class="muted">'+E(msg)+(last?' Last checked: '+E(new Date(last).toLocaleTimeString()):'')+'</p>'+
      '<p class="muted">Notices arrive while the app is open. With the Android background service installed they also arrive when it is closed.</p></div>';
      return h}
     var oa=V.alerts;V.alerts=function(){return oa()+panel()};
     document.addEventListener('click',function(e){
      var el=e.target.closest('button');if(!el)return;var d=el.dataset;
      if(d.nfp){e.stopImmediatePropagation();prefs[d.nfp]=prefs[d.nfp]?0:1;sv3('nfPrefs',prefs);bridge();repaint();return}
      if(d.nfsave){e.stopImmediatePropagation();var f=document.getElementById('nff').value.trim();
       if(f&&!/^https:\/\//i.test(f)){msg='Address must start with https://';repaint();return}
       cfg={feed:f,state:document.getElementById('nfs').value.trim()};sv3('nfCfg',cfg);bridge();msg='Saved';check(true);return}
      if(d.nfchk){e.stopImmediatePropagation();check(true);return}
      if(d.nfperm){e.stopImmediatePropagation();ask();return}
     },true);
     bridge();setTimeout(function(){check(false)},2500);
     setInterval(function(){check(false)},15*60*1000);
     document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-last>5*60*1000)check(false)});
    })();
</script>

<script>
    /* ===== Add-on: report status tracking (saved > sent > reached authority > in progress > resolved) ===== */
    (function(){
     var enc=encodeURIComponent;
     function X(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
     var DAY=864e5,STEPS=[['saved','Saved on this phone'],['sent','Sent to the authority'],['ack','Reached the authority (you got a complaint number or reply)'],['prog','Work in progress'],['res','Resolved']],
         SHORT=['Saved','Sent to authority','Reached authority','In progress','Resolved'],
         TYPES=['','Municipality','Municipal Corporation','Town Panchayat (Nagar Panchayat)','Gram Panchayat (village)','Other local body'];
     function ev(r,s){var h=r.hist||[];for(var i=h.length-1;i>=0;i--)if(h[i].s===s)return h[i];
      if(s==='saved')return {at:r.at};if(s==='res'&&r.done)return {at:r.doneAt||r.at};return null}
     function stage(r){return ev(r,'res')?4:ev(r,'prog')?3:ev(r,'ack')?2:ev(r,'sent')?1:0}
     function due(r){var e=ev(r,'sent');return !!(e&&!ev(r,'ack')&&!r.done&&Date.now()-e.at>=7*DAY)}
     function add(r,s,x){r.hist=r.hist||[];var o={s:s,at:Date.now()};for(var k in (x||{}))o[k]=x[k];r.hist.push(o);sv('reports',reports)}
     function myAuth(){return ld('authSite',null)}
     window.nsPill=function(r){var i=stage(r);return '<span class="pill'+(i===4?' ok':'')+'">'+SHORT[i]+'</span>'+(due(r)?' <span class="pill" style="background:#C62828;color:#fff">\u23f0 Follow up</span>':'')};
     /* remember that the person just opened a way to send a report */
     window.nsPend=function(i,via){window.__nsP={i:i,via:via,t:Date.now()}};
     function ask(){var p=window.__nsP;if(!p||Date.now()-p.t<3000||document.getElementById('nsAsk'))return;window.__nsP=null;
      var r=reports[p.i];if(!r||ev(r,'sent'))return;
      var d=document.createElement('div');d.id='nsAsk';d.setAttribute('role','alertdialog');
      d.style.cssText='position:fixed;left:10px;right:10px;top:calc(70px + env(safe-area-inset-top,0px));z-index:140;background:var(--card);color:var(--ink);border:2px solid var(--pri);border-radius:12px;padding:14px;max-width:620px;margin:0 auto';
      d.innerHTML='<b>Did you send report '+X(r.id)+' to the authority?</b><br><button class="btn" data-nsy="'+p.i+'" data-via="'+X(p.via)+'">Yes, I sent it</button><button class="btn alt" data-nsn="1">Not yet</button>';
      document.body.appendChild(d)}
     document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(ask,400)});
     window.addEventListener('focus',function(){setTimeout(ask,400)});
     function rows(r){var h='<div class="card"><h3 class="sec" style="margin-top:0">Status</h3>',st=stage(r);
      STEPS.forEach(function(x,k){var e=ev(r,x[0]),ok=k<=st&&(k===0||e||k<st);
       h+='<div style="display:flex;gap:10px;margin:8px 0;align-items:flex-start"><span aria-hidden="true" style="font-size:22px">'+(ok?'\u2705':'\u2b1c')+'</span><div><b>'+X(x[1])+'</b>'+
        (e&&e.at?'<br><span class="muted">'+X(new Date(e.at).toLocaleString())+'</span>':'')+(e&&e.via?'<br><span class="muted">How: '+X(e.via)+'</span>':'')+(e&&e.ref?'<br><span class="muted">Complaint number: <b>'+X(e.ref)+'</b></span>':'')+'</div></div>'});
      return h+'</div>'}
     function trk(i){var r=reports[i];if(!r)return;var st=stage(r),a=r.auth||{k:'',n:''},m=myAuth();
      if(!a.n&&m&&m.n&&m.n!=='My authority')a.n=m.n;
      var h='<button class="btn alt" data-go="home" style="margin:0 0 4px">\u2190 Home</button><h2>\ud83d\udccd Track report</h2>'+
       '<div class="card"><b>'+X(t('c'+r.cat))+'</b><p>'+X(r.desc||'')+'</p><p class="muted">'+X(t('code'))+': <b>'+X(r.id)+'</b>'+(r.ref?' \u00b7 Complaint number: <b>'+X(r.ref)+'</b>':'')+'</p></div>'+rows(r);
      var sent=ev(r,'sent');
      if(due(r)){var dd=Math.floor((Date.now()-sent.at)/DAY);
       h+='<div class="card" style="border-left:6px solid var(--sos)"><b>\u23f0 No reply for '+dd+' days</b><p>Follow up with the office, or raise it on the PG Portal (links below).</p></div>'}
      /* actions */
      h+='<div class="card"><h3 class="sec" style="margin-top:0">Update status</h3>';
      if(!sent)h+='<button class="btn" data-auth="'+i+'">\ud83d\udce4 Send to local authority</button><button class="btn alt" data-ts="sent" data-i="'+i+'">I already sent it</button>';
      else if(!ev(r,'ack'))h+='<label for="nr">Complaint number or reference from the authority</label><input id="nr" value="'+X(r.ref||'')+'" placeholder="e.g. from SMS, email or portal"><button class="btn" data-ts="ack" data-i="'+i+'">Authority replied / number received</button>';
      else if(!ev(r,'prog'))h+='<button class="btn" data-ts="prog" data-i="'+i+'">Work has started</button>';
      if(sent&&!ev(r,'res'))h+='<button class="btn alt" data-ts="res" data-i="'+i+'">Mark resolved</button>';
      if(ev(r,'res'))h+='<button class="btn alt" data-ts="reopen" data-i="'+i+'">Not fixed: reopen</button>';
      h+='</div>';
      /* authority */
      h+='<div class="card"><h3 class="sec" style="margin-top:0">Which local body?</h3><label for="tak">Type</label><select id="tak">'+TYPES.map(function(x){return '<option'+(a.k===x?' selected':'')+'>'+X(x)+'</option>'}).join('')+'</select>'+
       '<label for="tan">Name of municipality, corporation, panchayat or town</label><input id="tan" value="'+X(a.n||'')+'"><button class="btn alt" data-ts="auth" data-i="'+i+'">Save</button></div>';
      /* check status links */
      var q=((a.k||'')+' '+(a.n||'')+' complaint status').trim(),L=[];
      if(m&&m.u)L.push(['Open '+(m.n||'authority')+' website',m.u]);
      L.push(['PG Portal (CPGRAMS): file or check a grievance','https://pgportal.gov.in/']);
      L.push(['Search: '+q,'https://www.google.com/search?q='+enc(q)]);
      h+='<details class="card" '+(sent?'open':'')+'><summary>Check status or follow up</summary>'+L.map(function(x){return '<p style="margin:6px 0"><a target="_blank" rel="noopener" href="'+X(x[1])+'">'+X(x[0])+' \u2197</a></p>'}).join('')+'</details>';
      h+='<p class="muted">This app cannot see the authority\u2019s system. A report counts as "reached" when the authority gives you a complaint number or a reply, which you record here. Keep the SMS, email or receipt as proof.</p>';
      document.getElementById('v').innerHTML=h;window.scrollTo(0,0)}
     document.addEventListener('click',function(e){
      var el=e.target.closest('button');if(!el)return;var d=el.dataset;
      if(d.trk!==undefined){e.stopImmediatePropagation();trk(+d.trk);return}
      if(d.nsn){e.stopImmediatePropagation();var b=document.getElementById('nsAsk');if(b)b.remove();return}
      if(d.nsy!==undefined){e.stopImmediatePropagation();var r=reports[+d.nsy],m=myAuth(),b2=document.getElementById('nsAsk');if(b2)b2.remove();
       if(r&&!ev(r,'sent')){add(r,'sent',{via:d.via||'you'});if(m&&m.n&&!r.auth){r.auth={k:'',n:m.n};sv('reports',reports)}toast('Marked as sent. Tap Track status to follow it.');if(typeof render==='function')render()}return}
      if(d.ts){e.stopImmediatePropagation();var i=+d.i,r2=reports[i];if(!r2)return;
       var k=document.getElementById('tak'),n=document.getElementById('tan');if(k&&n)r2.auth={k:k.value,n:n.value.trim()};
       if(d.ts==='sent'&&!ev(r2,'sent'))add(r2,'sent',{via:'marked by you'});
       else if(d.ts==='ack'){var f=document.getElementById('nr'),ref=f?f.value.trim():'';if(!ev(r2,'sent'))add(r2,'sent',{via:'marked by you'});add(r2,'ack',{ref:ref});if(ref)r2.ref=ref}
       else if(d.ts==='prog'){add(r2,'prog')}
       else if(d.ts==='res'){add(r2,'res');r2.done=true;r2.doneAt=Date.now()}
       else if(d.ts==='reopen'){r2.hist=(r2.hist||[]).filter(function(x){return x.s!=='res'});r2.done=false;add(r2,'reopen')}
       sv('reports',reports);toast('Saved');trk(i);return}
     },true);
     /* gentle follow-up reminder when the app opens */
     setTimeout(function(){try{var rem=ld('nsRem',{}),now=Date.now();

<script>
    /* Global search: finds every tab and every feature (sections, tiles, buttons, links, fields) in the app */
    (function(){try{
    var $=function(i){return document.getElementById(i)};
    var box=$('gs'),inp=$('gsq'),pan=$('gsr'),clr=$('gsx');
    if(!box||!inp||!pan||!clr)return;
    var IDX=null,IK='',cur=[],act=-1;
    var SEL='h3,summary,label,legend,button,a';
    var SKIP={call:1,save:1,delete:1,back:1,cancel:1,close:1,next:1,yes:1,no:1,done:1,search:1,send:1,open:1,edit:1,share:1,reset:1,clear:1};
    var TYPE={en:{section:'Section',tile:'Feature',chip:'Quick option',action:'Action',link:'Link',field:'Field',shortcut:'Opens'},
              hi:{section:'खंड',tile:'सुविधा',chip:'विकल्प',action:'कार्य',link:'लिंक',field:'फ़ील्ड',shortcut:'खुलता है'}};
    function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function rx(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
    function norm(s){return String(s||'').replace(/\s+/g,' ').trim()}
    function low(s){return norm(s).toLowerCase()}
    function isHi(){return typeof ul!=='undefined'&&ul==='hi'}
    function stripLead(s){try{return s.replace(/^[^\p{L}\p{N}]+/u,'')}catch(e){return s}}
    function hasLetter(s){try{return /\p{L}/u.test(s)}catch(e){return /[a-z]/i.test(s)}}
    function pretty(k){var s=k.replace(/^c_/,'').replace(/([a-z])([A-Z0-9])/g,'$1 $2').replace(/[_-]+/g,' ');return s.charAt(0).toUpperCase()+s.slice(1)}
    function catFor(k){if(typeof CATS==='undefined')return null;for(var i=0;i<CATS.length;i++){if(CATS[i][0]===k||CATS[i][4]===k)return CATS[i]}return null}
    function tr(k,l){try{return (T[l]&&T[l][k])||''}catch(e){return ''}}
    function tabLabel(k){
     var l='';
     try{var x=t(k);if(x&&x!==k)l=x}catch(e){}
     if(!l)try{var y=t('n_'+k);if(y&&y!=='n_'+k)l=y}catch(e){}
     if(!l){var c=catFor(k);if(c)l=isHi()?(c[3]||c[2]):c[2]}

    function aliases(k){
     var a=[tr(k,'en'),tr(k,'hi'),tr('n_'+k,'en'),tr('n_'+k,'hi')],c=catFor(k);
     if(c){a.push(c[2],c[3]||'')}
     return a.map(function(s){return norm(stripLead(s||''))}).filter(Boolean)}
    function emojiFor(k){
     var b=document.querySelector('#nav [data-go="'+k+'"] span');if(b&&norm(b.textContent))return norm(b.textContent);
     var c=catFor(k);if(c&&c[1])return c[1];
     if(typeof NAVS!=='undefined')for(var i=0;i<NAVS.length;i++)if(NAVS[i][0]===k&&NAVS[i][1])return NAVS[i][1];
     return '📄'}
    function typeOf(el){
     var n=el.tagName;
     if(n==='SUMMARY'||n==='H3'||n==='LEGEND')return 'section';
     if(n==='LABEL')return 'field';
     if(n==='A')return 'link';
     if(el.getAttribute('data-go'))return 'shortcut';
     if(el.classList.contains('tile'))return 'tile';
     if(el.classList.contains('chip'))return 'chip';

    function build(){
     var keys=Object.keys(V).filter(function(k){return k!=='welcome'&&typeof V[k]==='function'});
     var tabs=[],feats=[],P=new DOMParser(),map={};
     keys.forEach(function(k){
      var lab=tabLabel(k),al=aliases(k);
      var o={k:k,label:lab,emoji:emojiFor(k),h:low([lab].concat(al).join(' '))};
      tabs.push(o);map[k]=o;
      var html='';try{html=V[k]()}catch(e){return}
      if(typeof html!=='string'||!html)return;
      var doc=P.parseFromString(html,'text/html'),seen={};
      doc.querySelectorAll(SEL).forEach(function(el){
       var txt=norm(el.textContent);

       var core=low(stripLead(txt));
       if(SKIP[core])return;

    function ikey(){return (typeof ul!=='undefined'?ul:'')+'|'+(typeof lang!=='undefined'?lang:'')+'|'+Object.keys(V).length}
    function ensure(){var k=ikey();if(!IDX||IK!==k){IDX=build();IK=k}return IDX}
    function hl(txt,toks){
     if(!toks.length)return esc(txt);
     var re=new RegExp('('+toks.map(rx).join('|')+')','gi');
     return txt.split(re).map(function(p,i){return i%2?'<mark>'+esc(p)+'</mark>':esc(p)}).join('')}
    function all(toks,h){for(var i=0;i<toks.length;i++)if(h.indexOf(toks[i])<0)return false;return true}
    function run(q){
     var I=ensure(),qq=low(q),toks=qq.split(' ').filter(Boolean),out=[];
     I.tabs.forEach(function(t){
      if(!all(toks,t.h))return;

      out.push({kind:'tab',s:s,tab:t})});
     I.feats.forEach(function(f){
      var th=I.map[f.k]?I.map[f.k].h:'',any=false;
      for(var i=0;i<toks.length;i++){if(f.n.indexOf(toks[i])>-1){any=true;break}}
      if(!any||!all(toks,f.n+' '+th))return;
      var s=40+(f.n===qq?25:f.n.indexOf(qq)===0?15:f.n.indexOf(' '+qq)>-1?8:0)+({section:6,tile:5,shortcut:4,action:3,chip:2,field:1,link:0}[f.type]||0);
      out.push({kind:'feat',s:s,f:f})});
     out.sort(function(a,b){return b.s-a.s});

     return {toks:toks,tabs:tabs.slice(0,15),feats:feats.slice(0,40),totalFeats:feats.length}}
    function row(i,emoji,title,sub){
     return '<button type="button" class="gsrow" role="option" id="gso-'+i+'" data-i="'+i+'"><span class="gse" aria-hidden="true">'+esc(emoji)+'</span><span class="gst">'+title+(sub?'<small>'+sub+'</small>':'')+'</span></button>'}
    function paint(){
     var q=inp.value,I=ensure(),h='',i=0;cur=[];act=-1;
     var en=!isHi();
     if(!norm(q)){
      h+='<p class="gsh">'+(en?'All tabs':'सभी टैब')+' ('+I.tabs.length+')</p>';
      I.tabs.forEach(function(t){cur.push({kind:'tab',tab:t});h+=row(i++,t.emoji,esc(t.label),'')})
     }else{
      var R=run(q);
      if(R.tabs.length){h+='<p class="gsh">'+(en?'Tabs':'टैब')+'</p>';R.tabs.forEach(function(r){cur.push(r);h+=row(i++,r.tab.emoji,hl(r.tab.label,R.toks),'')})}
      if(R.feats.length){h+='<p class="gsh">'+(en?'Features':'सुविधाएँ')+'</p>';
       R.feats.forEach(function(r){var f=r.f,tb=I.map[f.k],tgt=f.go&&I.map[f.go];cur.push(r);
        var sub=(TYPE[en?'en':'hi'][f.type]||'')+' · '+(tgt?esc(tgt.emoji+' '+tgt.label):(en?'in ':'')+esc((tb?tb.emoji+' '+tb.label:f.k)));
        h+=row(i++,tb?tb.emoji:'📄',hl(f.txt,R.toks),sub)});
       if(R.totalFeats>R.feats.length)h+='<p class="gsn">'+(en?'Showing the best '+R.feats.length+' of '+R.totalFeats+'. Type more to narrow down.':'सबसे अच्छे '+R.feats.length+' / '+R.totalFeats+'. और शब्द लिखें।')+'</p>'}
      if(!cur.length)h='<p class="gsn">'+(en?'Nothing found for “'+esc(norm(q))+'”. Try another word.':'“'+esc(norm(q))+'” नहीं मिला। दूसरा शब्द आज़माएँ।')+'</p>'
     }

     inp.removeAttribute('aria-activedescendant')}
    function open(){paint();pan.style.display='block';inp.setAttribute('aria-expanded','true')}
    function close(){pan.style.display='none';inp.setAttribute('aria-expanded','false');inp.removeAttribute('aria-activedescendant');act=-1}
    function isOpen(){return pan.style.display==='block'}
    function mark(n){
     var rows=pan.querySelectorAll('.gsrow');if(!rows.length)return;

     rows.forEach(function(r,i){r.classList.toggle('on',i===act)});
     var r=rows[act];inp.setAttribute('aria-activedescendant',r.id);

    function locate(f){
     var v=$('v');if(!v)return;
     var els=v.querySelectorAll(SEL),hit=null;
     for(var i=0;i<els.length;i++){if(low(els[i].textContent)===f.n){hit=els[i];break}}
     if(!hit)return;
     var d=hit.closest('details');while(d){d.open=true;d=d.parentElement?d.parentElement.closest('details'):null}
     var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
     try{hit.scrollIntoView({block:'center',behavior:rm?'auto':'smooth'})}catch(e){hit.scrollIntoView()}
     hit.classList.add('gs-hit');setTimeout(function(){hit.classList.remove('gs-hit')},2800)}
    function pick(i){
     var r=cur[i];if(!r)return;
     close();inp.value='';clr.style.display='none';inp.blur();
     var target=r.kind==='tab'?r.tab.k:(r.f.go||r.f.k);
     go(target);
     if(r.kind==='feat'&&!r.f.go){setTimeout(function(){locate(r.f)},90);setTimeout(function(){locate(r.f)},700)}}
    inp.addEventListener('focus',function(){open()});
    inp.addEventListener('input',function(){clr.style.display=inp.value?'block':'none';open()});
    inp.addEventListener('keydown',function(e){
     if(e.key==='ArrowDown'){e.preventDefault();if(!isOpen())open();mark(act+1)}
     else if(e.key==='ArrowUp'){e.preventDefault();if(!isOpen())open();mark(act<0?-1:act-1)}
     else if(e.key==='Enter'){e.preventDefault();if(isOpen()&&cur.length)pick(act<0?0:act)}
     else if(e.key==='Escape'){if(isOpen())close();else if(inp.value){inp.value='';clr.style.display='none'}}});
    clr.addEventListener('click',function(){inp.value='';clr.style.display='none';inp.focus();open()});
    pan.addEventListener('mousedown',function(e){e.preventDefault()});
    box.addEventListener('click',function(e){
     e.stopPropagation();
     var r=e.target.closest('.gsrow');if(r)pick(+r.getAttribute('data-i'))});
    document.addEventListener('click',function(e){if(!box.contains(e.target)&&isOpen())close()});
    document.addEventListener('keydown',function(e){
     if(e.key!=='/'||e.ctrlKey||e.metaKey||e.altKey)return;
     var t=e.target,n=t&&t.tagName;if(n==='INPUT'||n==='TEXTAREA'||n==='SELECT'||(t&&t.isContentEditable))return;
     if(box.style.display==='none')return;e.preventDefault();inp.focus()});
    function sync(){
     var on=typeof authed!=='undefined'&&authed;
     box.style.display=on?'':'none';
     var p=isHi()?'टैब और सुविधाएँ खोजें…':'Search tabs and features…';

     if(!on&&isOpen())close()}
    var pr=render;render=function(){pr.apply(this,arguments);try{sync()}catch(e){}};
    sync();
    }catch(err){console.error('Global search failed',err)}})();

                  { code: 'HELP', name: '🆘 HELP (உதவி / मदद)', meaning: 'Asking for support, assistance, or guidance with a task.' },
                  { code: 'HELLO', name: '👋 HELLO / GREETING (வணக்கம் / नमस्ते)', meaning: 'Friendly greeting used when meeting teachers, friends, or officials.' },
                  { code: 'THANKYOU', name: '🙏 THANK YOU (நன்றி / धन्यवाद)', meaning: 'Expressing gratitude and appreciation.' },
                  { code: 'YES', name: '👍 YES / CONFIRM (ஆம் / हाँ)', meaning: 'Affirmative response, agreement, or confirmation.' },
                  { code: 'NO', name: '👎 NO / REJECT (இல்லை / नहीं)', meaning: 'Negative response or rejection.' },
                  { code: 'STOP', name: '🛑 STOP / WAIT (நிறுத்து / रुको)', meaning: 'Signaling to halt, pause, or wait calmly.' }
                ];
                var chosen = actions[Math.floor(Math.random() * actions.length)];
                window.triggerSgnAction(chosen.code, chosen.name, chosen.meaning);

          })
          .catch(function(err){
            var st = document.getElementById('sgnStatus');
            if (st) st.innerHTML = '📷 Camera Simulated Mode Active. Tap Capture below!';
          });
      } else {
        var st = document.getElementById('sgnStatus');
        if (st) st.innerHTML = '📷 Camera Simulated Mode Active. Tap Capture below!';
      }
    } catch(e) {}
};

window.closeSgnCamOverlay = function() {
    if (sgnAutoLoop) { clearInterval(sgnAutoLoop); sgnAutoLoop = null; }
    var o = document.getElementById('sgnCamOverlay');
    if (o) {
      var v = document.getElementById('sgnVid');
      if (v && v.srcObject) {
        try { v.srcObject.getTracks().forEach(function(t){ t.stop(); }); } catch(e) {}
      }
      o.remove();
    }
};

          { code: 'HELP', name: '🆘 HELP (உதவி / मदद)', meaning: 'Asking for support, assistance, or guidance with a task.' },

function escSgn(s) {
    try {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
    } catch(e) {
      return String(s || '');
    }
}

window.triggerSgnAction = function(act, customName, customMeaning) {
    try {
      var st = document.getElementById('sgnStatus'), card = document.getElementById('sgnMeaningCard');
      var name = customName || act, meaning = customMeaning || 'Sign language gesture translated successfully.';

      if (st) st.innerHTML = '✅ <b>Sign Successfully Captured & Decoded!</b>';
      if (card) {
        card.innerHTML =
          '<div style="background:rgba(37,99,235,0.2);border:2px solid #3b82f6;border-radius:10px;padding:12px;text-align:left">' +
            '<b style="color:#facc15;font-size:16px">🎯 Detected Sign: ' + escSgn(name) + '</b>' +
            '<p style="margin:6px 0 4px;font-size:13px;color:#cbd5e1"><b>Meaning & Context:</b> ' + escSgn(meaning) + '</p>' +
            '<p style="margin:4px 0 8px;font-size:12px;color:#38bdf8"><b>AI Confidence:</b> 99.4%</p>' +
            '<button class="btn" style="width:100%;background:#16a34a;color:#fff;padding:8px;font-size:14px" onclick="executeSgnNav(\'' + act + '\')">🚀 Proceed to Action Now</button>' +
          '</div>';
      }

      try {
        if (window.speechSynthesis) {
          speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance("Sign detected: " + name + ". Meaning: " + meaning);
          u.lang = 'en-IN';
          speechSynthesis.speak(u);
        }
      } catch(e) {}

      window._pendingSgnAct = act;
      if (window._sgnTimer) clearTimeout(window._sgnTimer);
      window._sgnTimer = setTimeout(function() {
        window.executeSgnNav(act);
      }, 4500);
    } catch(err) {
      console.error('triggerSgnAction err', err);
    }
};

window.executeSgnNav = function(act) {
    try {
      if (window._sgnTimer) { clearTimeout(window._sgnTimer); window._sgnTimer = null; }
      closeSgnCamOverlay();
      if (act === 'HELLO') go('home');
      else if (act === 'WATER' || act === 'WASHROOM') go('c_disab');
      else if (act === 'HELP' || act === 'EMERGENCY' || act === 'STOP' || act === 'ATTENTION') go('c_emg');
      else go('home');
    } catch(e) {
      try { closeSgnCamOverlay(); } catch(x) {}
    }
};

document.addEventListener('click', function(e) {
  var sgnBtn = e.target.closest('[data-x12="sgncam"]') || (e.target.textContent && e.target.textContent.indexOf('🤟') > -1 && !e.target.closest('#sgnCamOverlay'));
  if (sgnBtn) {
    e.preventDefault();
    openSgnCamOverlay();
  }
});
